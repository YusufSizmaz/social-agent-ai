name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please **remove any API keys, tokens or passwords** from logs before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project with ...
        2. Add a Twitter account with ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Affected platform
      multiple: true
      options: [Twitter / X, Instagram, YouTube, TikTok, Dashboard, Video pipeline, WhatsApp notifications, Other]
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [Docker Compose, npm run dev, npm start (built), Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.1.0 or commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Set LOG_LEVEL=debug for more detail. Redact secrets.
      render: shell
